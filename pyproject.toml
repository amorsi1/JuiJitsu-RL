[project]
name = "JJ RL"
version = "0.1.0"
description = "Train RL agents to play Brazilian Jiu-Jitsu using GrappleMap's position database"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.15",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
